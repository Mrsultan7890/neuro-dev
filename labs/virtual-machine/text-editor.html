<!-- Text Editor Application -->
<div class="app-window" id="text-editor-app">
    <div class="window-header">
        <div class="window-controls">
            <span class="control minimize" onclick="minimizeWindow('text-editor-app')"></span>
            <span class="control maximize" onclick="maximizeWindow('text-editor-app')"></span>
            <span class="control close" onclick="closeWindow('text-editor-app')"></span>
        </div>
        <div class="window-title">
            <i class="fas fa-edit"></i> Text Editor - <span id="text-filename">untitled.txt</span>
        </div>
    </div>
    <div class="window-content" style="display: flex; flex-direction: column; background: #2d2d2d;">
        <div style="background: #3c3c3c; padding: 8px 12px; border-bottom: 1px solid #555; display: flex; gap: 8px; align-items: center;">
            <button onclick="newTextFile()" style="background: #4ecdc4; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">New</button>
            <button onclick="openTextFile()" style="background: #ffd93d; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Open</button>
            <button onclick="saveTextFile()" style="background: #00ff41; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Save</button>
            <button onclick="saveAsTextFile()" style="background: #ff6b6b; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Save As</button>
            <div style="margin-left: auto; color: #ccc; font-size: 12px;">
                Lines: <span id="line-count">1</span> | Words: <span id="word-count">0</span> | Chars: <span id="char-count">0</span>
            </div>
        </div>
        <textarea id="text-content" placeholder="Start typing..." style="flex: 1; background: #1a1a1a; color: #fff; border: none; padding: 15px; font-family: 'Ubuntu Mono', monospace; font-size: 14px; line-height: 1.5; resize: none; outline: none;"></textarea>
        
        <script>
        let currentTextFile = null;
        let isTextModified = false;
        
        function updateTextStats() {
            const content = document.getElementById('text-content').value;
            const lines = content.split('\n').length;
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            const chars = content.length;
            
            document.getElementById('line-count').textContent = lines;
            document.getElementById('word-count').textContent = words;
            document.getElementById('char-count').textContent = chars;
        }
        
        function newTextFile() {
            if (isTextModified && !confirm('Unsaved changes will be lost. Continue?')) return;
            
            document.getElementById('text-content').value = '';
            document.getElementById('text-filename').textContent = 'untitled.txt';
            currentTextFile = null;
            isTextModified = false;
            updateTextStats();
        }
        
        function openTextFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.md,.js,.py,.html,.css,.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById('text-content').value = e.target.result;
                        document.getElementById('text-filename').textContent = file.name;
                        currentTextFile = file.name;
                        isTextModified = false;
                        updateTextStats();
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }
        
        function saveTextFile() {
            const content = document.getElementById('text-content').value;
            const filename = currentTextFile || 'untitled.txt';
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            
            isTextModified = false;
        }
        
        function saveAsTextFile() {
            const filename = prompt('Enter filename:', currentTextFile || 'untitled.txt');
            if (filename) {
                currentTextFile = filename;
                document.getElementById('text-filename').textContent = filename;
                saveTextFile();
            }
        }
        
        // Track changes
        document.getElementById('text-content').addEventListener('input', () => {
            isTextModified = true;
            updateTextStats();
        });
        
        // Initialize
        updateTextStats();
        </script>
    </div>
</div>
