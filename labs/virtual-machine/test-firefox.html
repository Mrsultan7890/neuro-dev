<!DOCTYPE html>
<html>
<head>
    <title>Firefox Browser Test</title>
    <link rel="stylesheet" href="firefox-styles.css">
</head>
<body>
    <div id="browser-app" style="width: 100%; height: 100vh;">
        <div>Loading Firefox Browser...</div>
    </div>
    
    <script src="firefox-browser.js"></script>
    <script>
        console.log('Test page loaded');
        
        // Test Firefox browser initialization
        setTimeout(() => {
            console.log('Testing Firefox browser initialization...');
            if (window.FirefoxBrowser) {
                console.log('FirefoxBrowser class found');
                try {
                    const browser = new FirefoxBrowser();
                    console.log('Firefox browser initialized successfully');
                } catch (error) {
                    console.error('Error initializing Firefox browser:', error);
                }
            } else {
                console.error('FirefoxBrowser class not found');
            }
        }, 1000);
    </script>
</body>
</html>
