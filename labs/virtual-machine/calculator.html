<!-- Calculator Application -->
<div class="app-window" id="calculator-app">
    <div class="window-header">
        <div class="window-controls">
            <span class="control minimize" onclick="minimizeWindow('calculator-app')"></span>
            <span class="control maximize" onclick="maximizeWindow('calculator-app')"></span>
            <span class="control close" onclick="closeWindow('calculator-app')"></span>
        </div>
        <div class="window-title">
            <i class="fas fa-calculator"></i> Calculator
        </div>
    </div>
    <div class="window-content" style="padding: 20px; background: #2d2d2d; display: flex; justify-content: center;">
        <div style="background: #1a1a1a; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div id="calc-display" style="background: #000; color: #00ff41; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 24px; text-align: right; margin-bottom: 15px; min-height: 40px; border: 2px solid #333;">0</div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 280px;">
                <button onclick="clearCalc()" style="background: #ff6b6b; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">C</button>
                <button onclick="deleteLast()" style="background: #ffa500; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">⌫</button>
                <button onclick="appendToDisplay('/')" style="background: #4ecdc4; color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">÷</button>
                <button onclick="appendToDisplay('*')" style="background: #4ecdc4; color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">×</button>
                
                <button onclick="appendToDisplay('7')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">7</button>
                <button onclick="appendToDisplay('8')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">8</button>
                <button onclick="appendToDisplay('9')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">9</button>
                <button onclick="appendToDisplay('-')" style="background: #4ecdc4; color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">−</button>
                
                <button onclick="appendToDisplay('4')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">4</button>
                <button onclick="appendToDisplay('5')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">5</button>
                <button onclick="appendToDisplay('6')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">6</button>
                <button onclick="appendToDisplay('+')" style="background: #4ecdc4; color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">+</button>
                
                <button onclick="appendToDisplay('1')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">1</button>
                <button onclick="appendToDisplay('2')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">2</button>
                <button onclick="appendToDisplay('3')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">3</button>
                <button onclick="calculate()" style="background: #00ff41; color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; grid-row: span 2;">=</button>
                
                <button onclick="appendToDisplay('0')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; grid-column: span 2;">0</button>
                <button onclick="appendToDisplay('.')" style="background: #555; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer;">.</button>
            </div>
        </div>
        
        <script>
        let calcDisplay = '0';
        let shouldResetDisplay = false;
        
        function updateDisplay() {
            document.getElementById('calc-display').textContent = calcDisplay;
        }
        
        function appendToDisplay(value) {
            if (shouldResetDisplay) {
                calcDisplay = '';
                shouldResetDisplay = false;
            }
            
            if (calcDisplay === '0' && value !== '.') {
                calcDisplay = value;
            } else {
                calcDisplay += value;
            }
            updateDisplay();
        }
        
        function clearCalc() {
            calcDisplay = '0';
            updateDisplay();
        }
        
        function deleteLast() {
            if (calcDisplay.length > 1) {
                calcDisplay = calcDisplay.slice(0, -1);
            } else {
                calcDisplay = '0';
            }
            updateDisplay();
        }
        
        function calculate() {
            try {
                const result = eval(calcDisplay.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'));
                calcDisplay = result.toString();
                shouldResetDisplay = true;
                updateDisplay();
            } catch (error) {
                calcDisplay = 'Error';
                shouldResetDisplay = true;
                updateDisplay();
            }
        }
        </script>
    </div>
</div>
