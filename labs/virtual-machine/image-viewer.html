<!-- Image Viewer Application -->
<div class="app-window" id="image-viewer-app">
    <div class="window-header">
        <div class="window-controls">
            <span class="control minimize" onclick="minimizeWindow('image-viewer-app')"></span>
            <span class="control maximize" onclick="maximizeWindow('image-viewer-app')"></span>
            <span class="control close" onclick="closeWindow('image-viewer-app')"></span>
        </div>
        <div class="window-title">
            <i class="fas fa-image"></i> Image Viewer - <span id="image-filename">No image</span>
        </div>
    </div>
    <div class="window-content" style="display: flex; flex-direction: column; background: #2d2d2d;">
        <div style="background: #3c3c3c; padding: 8px 12px; border-bottom: 1px solid #555; display: flex; gap: 8px; align-items: center;">
            <button onclick="openImage()" style="background: #4ecdc4; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Open Image</button>
            <button onclick="zoomIn()" style="background: #00ff41; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Zoom In</button>
            <button onclick="zoomOut()" style="background: #ffd93d; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Zoom Out</button>
            <button onclick="resetZoom()" style="background: #ff6b6b; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Reset</button>
            <button onclick="rotateImage()" style="background: #9b59b6; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Rotate</button>
            <div style="margin-left: auto; color: #ccc; font-size: 12px;">
                Zoom: <span id="zoom-level">100%</span> | Size: <span id="image-size">-</span>
            </div>
        </div>
        <div style="flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #1a1a1a; position: relative;" id="image-container">
            <div style="color: #666; text-align: center; font-size: 18px;" id="no-image-message">
                <i class="fas fa-image" style="font-size: 48px; margin-bottom: 15px; display: block;"></i>
                No image loaded<br>
                <small>Click "Open Image" to load an image</small>
            </div>
            <img id="main-image" style="display: none; max-width: none; max-height: none; transition: transform 0.3s ease;" />
        </div>
        
        <script>
        let currentZoom = 100;
        let currentRotation = 0;
        let currentImage = null;
        
        function openImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.getElementById('main-image');
                        const noImageMsg = document.getElementById('no-image-message');
                        
                        img.src = e.target.result;
                        img.style.display = 'block';
                        noImageMsg.style.display = 'none';
                        
                        document.getElementById('image-filename').textContent = file.name;
                        currentImage = file;
                        currentZoom = 100;
                        currentRotation = 0;
                        
                        img.onload = () => {
                            updateImageInfo();
                            resetZoom();
                        };
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }
        
        function updateImageInfo() {
            const img = document.getElementById('main-image');
            if (img.naturalWidth && img.naturalHeight) {
                document.getElementById('image-size').textContent = `${img.naturalWidth}×${img.naturalHeight}`;
            }
            document.getElementById('zoom-level').textContent = currentZoom + '%';
        }
        
        function zoomIn() {
            if (!currentImage) return;
            currentZoom = Math.min(currentZoom + 25, 500);
            applyTransform();
        }
        
        function zoomOut() {
            if (!currentImage) return;
            currentZoom = Math.max(currentZoom - 25, 25);
            applyTransform();
        }
        
        function resetZoom() {
            if (!currentImage) return;
            currentZoom = 100;
            currentRotation = 0;
            applyTransform();
        }
        
        function rotateImage() {
            if (!currentImage) return;
            currentRotation = (currentRotation + 90) % 360;
            applyTransform();
        }
        
        function applyTransform() {
            const img = document.getElementById('main-image');
            img.style.transform = `scale(${currentZoom / 100}) rotate(${currentRotation}deg)`;
            updateImageInfo();
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('image-viewer-app').classList.contains('active')) {
                switch(e.key) {
                    case '+':
                    case '=':
                        e.preventDefault();
                        zoomIn();
                        break;
                    case '-':
                        e.preventDefault();
                        zoomOut();
                        break;
                    case '0':
                        e.preventDefault();
                        resetZoom();
                        break;
                    case 'r':
                    case 'R':
                        e.preventDefault();
                        rotateImage();
                        break;
                }
            }
        });
        </script>
    </div>
</div>
