<!-- Video Player Application -->
<div class="app-window" id="video-player-app">
    <div class="window-header">
        <div class="window-controls">
            <span class="control minimize" onclick="minimizeWindow('video-player-app')"></span>
            <span class="control maximize" onclick="maximizeWindow('video-player-app')"></span>
            <span class="control close" onclick="closeWindow('video-player-app')"></span>
        </div>
        <div class="window-title">
            <i class="fas fa-play-circle"></i> Video Player
        </div>
    </div>
    <div class="window-content" style="background: #000; display: flex; flex-direction: column;">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; background: #1a1a1a; position: relative;">
            <div style="text-align: center; color: #666;">
                <i class="fas fa-video" style="font-size: 80px; margin-bottom: 20px; display: block;"></i>
                <h3>No Video Loaded</h3>
                <p>Click "Open Video" to load a video file</p>
            </div>
        </div>
        
        <div style="background: #2d2d2d; padding: 15px; border-top: 1px solid #444;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                <button onclick="openVideo()" style="background: #00ff41; color: #000; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                    <i class="fas fa-folder-open"></i> Open Video
                </button>
                <button style="background: #555; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-play"></i>
                </button>
                <button style="background: #555; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-pause"></i>
                </button>
                <button style="background: #555; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-stop"></i>
                </button>
                <div style="flex: 1; margin: 0 15px;">
                    <input type="range" min="0" max="100" value="0" style="width: 100%; height: 5px; background: #555; border-radius: 5px; outline: none;">
                </div>
                <span style="color: #ccc; font-size: 12px; font-family: monospace;">00:00 / 00:00</span>
                <button style="background: #555; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button style="background: #555; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>
        
        <script>
        function openVideo() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    alert('Video player functionality would be implemented here');
                }
            };
            input.click();
        }
        </script>
    </div>
</div>
